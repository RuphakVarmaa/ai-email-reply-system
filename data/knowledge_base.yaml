# Reason codes used by customer-service scenarios
scenario_reasons:
  shipping_delay: ["weather disruption at a regional hub", "carrier backlog", "address issue flagged by carrier", "high order volume", "customs hold (international)"]
  defect_types: ["zipper failure", "seam split", "buckle crack", "waterproof membrane leak", "battery latch loose", "stitching unraveled"]

# Forbidden things a reply must never say (evaluator gates)
forbidden_reply_phrases:
  - "as an AI"
  - "I am an AI"
  - "language model"
  - "I cannot fulfill"
  - "delete your account"
  - "wire transfer"
  - "send us your password"
  - "social security number"
