# Northwind Supply Co. — Customer Support Knowledge Base (fictional)
# This is the "closed world" every email lives in. All facts referenced by
# dataset pairs, generated replies, and evaluations resolve here.

company:
  name: Northwind Supply Co.
  short_name: Northwind
  product: outdoor gear and accessories
  support_hours: "Mon–Fri, 9am–5pm ET"
  support_email: support@northwindsupply.example
  brand_voice:
    warm: "friendly, human, never corporate-stiff"
    concise: "answers first, pleasantries short"
    honest: "never promise what policies don't allow"
  signature: "— The Northwind Team"

policies:
  returns:
    window_days: 30            # from delivery date
    condition: "unused, tags attached, original packaging"
    exceptions: ["gift orders", "defective items"]
    restocking_fee_pct: 0      # no restocking fee
    return_shipping: "customer pays return shipping unless item was defective or we shipped the wrong item"
    exchange_shipping: "we cover shipping on exchanges for size/color"
    refund_method: "original payment method"
    refund_window_days: 5      # business days to appear after refund issued
    refund_window_text: "5–7 business days"
  shipping:
    domestic_standard_days: [3, 5]      # "3–5 business days"
    domestic_express_days: [1, 2]
    international_standard_days: [7, 14]
    international_express_days: [3, 5]
    free_shipping_threshold_usd: 75
    express_upgrade_fee_usd: 9.99
    cutoff_time: "2pm ET for same-day dispatch"
    carriers: ["ShipRight", "FleetPost"]
    tracking_note: "tracking links activate within 24 hours of label creation"
  warranty:
    duration_months: 24
    covers: ["manufacturing defects", "hardware failure under normal use"]
    not_covered: ["normal wear", "water damage from submersion", "damage from misuse"]
    process: "photo of defect + order number; we ship replacement before return of defective unit"
  orders:
    modification_window_hours: 2    # after order placed
    cancellation_before_ship: true
    price_adjustment_days: 14       # price-match/marketplace adjustment window
    address_change: "possible any time before the package is scanned by carrier"
  gift_cards:
    expiry_months: 24
    combinable_with_discounts: true
    physical_card_shipping: "free via standard mail"

